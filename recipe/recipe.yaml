context:
  name: mcp-server-fetch
  version: "2026.10.28"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  - url: https://pypi.org/packages/source/${{ name[0] }}/${{ name | replace('-','_') }}/${{ name | replace('-','_') }}-${{ version }}.tar.gz
    sha256: 03224d3f31d964504a83e31697608fe800fe541b6b626a419f9efcfbdfd87981

build:
  script: ${{ PYTHON }} -m pip install .
  noarch: python
  python:
    entry_points:
      - mcp-server-fetch  =  mcp_server_fetch:main
  number: 0

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - beautifulsoup4 >=4.7.1
    - httpx >=0.27
    - python >=${{ python_min }}
    - markdownify >=0.13.1
    - mcp >=2.3,<3
    - protego >=0.6.2
    - pydantic >=2.0.0
    - readabilipy >=0.3.0
    - requests >=2.32.3
    - socksio 1.*
    - nodejs

tests:
  - python:
      imports:
        - mcp_server_fetch
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - script:
      - python run_test.py
    files:
      recipe:
        - run_test.py

about:
  summary: A Model Context Protocol server providing tools to fetch and convert web content for usage by LLMs
  description: |-
    A Model Context Protocol server that provides web content fetching capabilities.
    This server enables LLMs to retrieve and process content from web pages, converting HTML to markdown for easier consumption.
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/modelcontextprotocol/servers/tree/main/src/fetch
extra:
  recipe-maintainers:
    - iamthebot
